name: Capture refreshed project website screenshots

on:
  push:
    branches:
      - portfolio-projects-refresh-2026-11-11

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          ref: portfolio-projects-refresh-2026-11-11
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: npx --yes playwright@latest install --with-deps chromium

      - name: Capture current live website designs
        shell: bash
        run: |
          set +e

          capture() {
            url="$1"
            destination="$2"

            echo "::group::Capture $url"
            if curl --fail --location --silent --show-error --max-time 30 "$url" --output /dev/null; then
              npx --yes playwright@latest screenshot \
                --browser chromium \
                --viewport-size="1440,1000" \
                --wait-for-timeout=7000 \
                --timeout=45000 \
                "$url" "$destination"

              if [ "$?" -eq 0 ]; then
                echo "Captured $destination"
              else
                echo "::warning::Could not capture $url; keeping the existing image."
                rm -f "$destination"
              fi
            else
              echo "::warning::Website did not return a successful response: $url. Keeping the existing image."
            fi
            echo "::endgroup::"
          }

          capture "https://www.qoutesnap.co.za/" "public/images/quotesnap.png"
          capture "https://karibaworldjobs.com/" "public/images/karibaworld.png"
          capture "https://eazylink.co.za/" "public/images/eazylinkjobs.png"
          capture "https://devsolutionsza.shop/" "public/images/devsolutionsshop.png"
          capture "https://www.makhsafety.co.za/" "public/images/makhsafety.png"
          capture "https://www.nollymwayleave.co.za/" "public/images/nollymwayleave.png"
          capture "https://www.allthingshygiene.co.za/" "public/images/allthingshygiene.png"

      - name: Commit refreshed screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/*.png

          if git diff --cached --quiet; then
            echo "No screenshots were updated. Existing screenshots are unchanged."
          else
            git commit -m "chore: refresh live project website screenshots"
            git fetch origin portfolio-projects-refresh-2026-11-11
            git rebase origin/portfolio-projects-refresh-2026-11-11
            git push origin HEAD:portfolio-projects-refresh-2026-11-11
          fi
